resilience4j:
  retry:
    instances:
      inventoryRetry:
        maxRetryAttempts: 3
        waitDuration: 5s
  rateLimiter:
    instances:
      inventoryRateLimiter:
        limitForPeriod: 2 #Max 2 requests per period
        limitRefreshPeriod: 5s # Refresh the limit every 5 seconds
        timeoutDuration: 1s # Time to wait for permission before a request fails

