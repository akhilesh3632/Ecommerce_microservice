server:
    port: 8080

spring:
    application:
        name: api-gateway
    #api gateway configuration
    cloud:
        gateway:
          server:
            webflux:
              routes:
                - id: order-service
                  uri: lb://ORDER-SERVICE
                  predicates:
                    - Path=/api/v1/orders/**
                  filters:
                    - StripPrefix=2

                - id: inventory-service
                  uri: lb://INVENTORY-SERVICE
                  predicates:
                    - Path=/api/v1/inventory/**
                  filters:
                    - StripPrefix=2